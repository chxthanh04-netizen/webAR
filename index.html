<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR 3D Viewer</title>

  <!-- Load thư viện trước -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // Component tự động căn giữa và đặt chân mô hình lên đúng mặt phẳng marker
    AFRAME.registerComponent('auto-center', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          // Tính bounding box của mô hình
          const box = new THREE.Box3().setFromObject(obj);
          const center = new THREE.Vector3();
          box.getCenter(center);

          // Điểm đáy ở giữa mô hình
          const bottom = new THREE.Vector3(center.x, box.min.y, center.z);

          // Chuyển sang tọa độ local của entity
          this.el.object3D.worldToLocal(bottom);

          // Căn chỉnh để tâm X, Z ở giữa marker và chân Y chạm mặt marker
          obj.position.x -= bottom.x;
          obj.position.y -= bottom.y;
          obj.position.z -= bottom.z;
        });
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #splash {
      position: fixed; inset: 0; z-index: 10000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; padding: 20px; text-align: center;
    }
    #splash h1 { font-size: 28px; margin-bottom: 8px; }
    #splash p { font-size: 15px; color: #aaa; margin-bottom: 30px; max-width: 320px; }
    #start-btn {
      padding: 18px 50px; font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff; border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 25px rgba(0,180,216,0.4);
    }
    #start-btn:active { transform: scale(0.95); }
    .platform-badge {
      margin-top: 20px; font-size: 12px; color: #666;
      padding: 6px 14px; border: 1px solid #333; border-radius: 20px;
    }

    #hud {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9997;
      padding: 16px 20px 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      text-align: center; display: none;
    }
    #hud .hint { color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .status {
      display: inline-block; margin-top: 8px; padding: 4px 12px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .status-searching { background: rgba(255,193,7,0.3); color: #ffc107; border: 1px solid rgba(255,193,7,0.5); }
    .status-found { background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid rgba(76,175,80,0.5); }

    /* Gesture controls UI */
    #gesture-hint {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 9998; display: none;
      background: rgba(0,0,0,0.6); border-radius: 20px;
      padding: 8px 16px; font-size: 12px; color: #fff;
      white-space: nowrap; pointer-events: none;
    }
    #reset-btn {
      position: fixed; top: 16px; right: 16px; z-index: 9998;
      display: none;
      background: rgba(0,0,0,0.55); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; border-radius: 50px; padding: 8px 16px;
      font-size: 13px; cursor: pointer;
    }
  </style>
</head>
<body>

  <!-- Splash overlay - phủ lên AR scene bên dưới -->
  <div id="splash">
    <h1>📦 AR 3D Viewer</h1>
    <p>Nhấn nút bên dưới để bắt đầu. Hướng camera vào marker Hiro để xem mô hình 3D.</p>
    <button id="start-btn">📷 Bắt đầu AR</button>
    <div class="platform-badge" id="platform-info"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hint">📌 Hướng camera vào marker Chánh Điện</div>
    <div class="status status-searching" id="marker-status">🔍 Đang tìm marker...</div>
  </div>

  <!-- Gesture hint & Reset button -->
  <div id="gesture-hint">🔄 Vuốt ngang: xoay ngang &nbsp;|&nbsp; ☝️ Vuốt dọc: nghiêng &nbsp;|&nbsp; 🤏 Pinch: zoom</div>
  <button id="reset-btn">↺ Reset</button>

  <!-- AR Scene - luôn có trong DOM, splash chỉ phủ lên trên -->
  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix; matrixCodeType: 3x3;
            patternRatio: 0.75;">

    <a-assets timeout="15000">
      <a-asset-item id="myModel" src="models/chanh_dien.glb"></a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <a-marker type="pattern" url="marker/pattern_chanh_dien.patt"
              emitevents="true"
              smooth="true" smoothCount="10"
              smoothTolerance="0.01" smoothThreshold="5"
              id="hiro-marker">
      <a-entity
        id="dragon-entity"
        gltf-model="#myModel"
        position="0 0 0"
        rotation="-80 0 0"
        scale="0.1 0.1 0.1"
        auto-center>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Platform detection
    var ua = navigator.userAgent;
    var info = /iPhone|iPad|iPod/.test(ua) ? '🍎 iOS — Dùng Safari'
             : /Android/.test(ua) ? '🤖 Android — Dùng Chrome'
             : '💻 Desktop — Cần webcam';
    document.getElementById('platform-info').textContent = info;

    // Start button - chỉ ẩn splash, AR scene đã chạy bên dưới
    document.getElementById('start-btn').addEventListener('click', function() {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('hud').style.display = 'block';
      document.getElementById('gesture-hint').style.display = 'block';
      document.getElementById('reset-btn').style.display = 'block';

      // Marker events
      var marker = document.getElementById('hiro-marker');
      var statusEl = document.getElementById('marker-status');
      if (marker) {
        marker.addEventListener('markerFound', function() {
          statusEl.textContent = '✅ Marker đã nhận diện!';
          statusEl.className = 'status status-found';
        });
        marker.addEventListener('markerLost', function() {
          statusEl.textContent = '🔍 Đang tìm marker...';
          statusEl.className = 'status status-searching';
        });
      }
    });

    // ── GESTURE CONTROLS ──────────────────────────────────────────
    // Vuốt ngang  → xoay Y  (quay vòng quanh mô hình)
    // Vuốt dọc   → xoay X  (nghiêng: từ nhìn nóc → nhìn mặt bên)
    // Pinch 2 ngón → scale (zoom)
    var entity = document.getElementById('dragon-entity');

    var rotX    = -80;   // bắt đầu nghiêng sẵn để thấy mặt bên (không chỉ nóc)
    var rotY    = 0;     // xoay ngang
    var scl     = 0.1;   // scale hiện tại (đồng bộ với attribute ban đầu)

    var SENS_ROT  = 0.4;  // độ nhạy xoay (°/px)
    var SENS_ZOOM = 0.005; // độ nhạy zoom

    function applyTransform() {
      // Giới hạn rotX: -90° (nhìn nóc) → 10° (nhìn hơi từ dưới lên)
      rotX = Math.max(-90, Math.min(10, rotX));
      scl  = Math.max(0.02, Math.min(1.0, scl));
      entity.setAttribute('rotation', rotX + ' ' + rotY + ' 0');
      entity.setAttribute('scale',    scl + ' ' + scl + ' ' + scl);
    }

    // Reset
    document.getElementById('reset-btn').addEventListener('click', function() {
      rotX = -80;
      rotY = 0;
      scl  = 0.1;
      applyTransform();
    });

    // ── TOUCH ─────────────────────────────────────────────────────
    var lastTouchX  = null;
    var lastTouchY  = null;
    var lastPinchDist = null;

    function getPinchDist(touches) {
      var dx = touches[0].clientX - touches[1].clientX;
      var dy = touches[0].clientY - touches[1].clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    document.addEventListener('touchstart', function(e) {
      if (e.touches.length === 1) {
        lastTouchX    = e.touches[0].clientX;
        lastTouchY    = e.touches[0].clientY;
        lastPinchDist = null;
      } else if (e.touches.length === 2) {
        lastPinchDist = getPinchDist(e.touches);
        lastTouchX = lastTouchY = null;
      }
    }, { passive: true });

    document.addEventListener('touchmove', function(e) {
      if (!entity) return;

      if (e.touches.length === 2) {
        // ── PINCH ZOOM ──
        var dist = getPinchDist(e.touches);
        if (lastPinchDist !== null) {
          var delta = dist - lastPinchDist;
          scl += delta * SENS_ZOOM;
          applyTransform();
        }
        lastPinchDist = dist;
        return;
      }

      if (e.touches.length !== 1 || lastTouchX === null) return;

      var x  = e.touches[0].clientX;
      var y  = e.touches[0].clientY;
      var dx = x - lastTouchX;
      var dy = y - lastTouchY;

      if (Math.abs(dx) >= Math.abs(dy)) {
        // Chủ yếu ngang → xoay Y (quay quanh mô hình)
        rotY += dx * SENS_ROT;
      } else {
        // Chủ yếu dọc → xoay X (nghiêng mô hình)
        // Vuốt lên (dy âm) → ngẩng lên (rotX tăng về 0/dương)
        // Vuốt xuống (dy dương) → cúi xuống (rotX giảm về -90)
        rotX += dy * SENS_ROT;
      }
      applyTransform();

      lastTouchX = x;
      lastTouchY = y;
    }, { passive: true });

    document.addEventListener('touchend', function(e) {
      if (e.touches.length < 2) lastPinchDist = null;
      if (e.touches.length === 0) { lastTouchX = lastTouchY = null; }
    }, { passive: true });

    // ── MOUSE (desktop) ──────────────────────────────────────────
    var mouseDown  = false;
    var lastMouseX = null;
    var lastMouseY = null;

    document.addEventListener('mousedown', function(e) {
      mouseDown  = true;
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });
    document.addEventListener('mouseup', function() { mouseDown = false; });
    document.addEventListener('mousemove', function(e) {
      if (!mouseDown || !entity) return;
      var dx = e.clientX - lastMouseX;
      var dy = e.clientY - lastMouseY;
      if (Math.abs(dx) >= Math.abs(dy)) {
        rotY += dx * SENS_ROT;
      } else {
        rotX += dy * SENS_ROT;
      }
      applyTransform();
      lastMouseX = e.clientX;
      lastMouseY = e.clientY;
    });

    // Mouse wheel zoom (desktop)
    document.addEventListener('wheel', function(e) {
      if (!entity) return;
      scl -= e.deltaY * 0.0003;
      applyTransform();
    }, { passive: true });
  
  </script>
</body>
</html>
