<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR 3D Viewer</title>

  <!-- Thư viện AR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- A-Frame components (phải đăng ký trước khi scene khởi động) -->
  <script>
    AFRAME.registerComponent('auto-fit', {
      schema: { size: { type: 'number', default: 1 } },
      init: function () { this.el.addEventListener('model-loaded', this.fit.bind(this)); },
      fit: function () {
        var el = this.el, mesh = el.getObject3D('mesh');
        if (!mesh) return;
        var obj = el.object3D, parent = obj.parent;
        obj.position.set(0, 0, 0); obj.scale.set(1, 1, 1);
        parent.updateMatrixWorld(true);
        var inv = new THREE.Matrix4().copy(parent.matrixWorld).invert();
        var m = new THREE.Matrix4(), tmp = new THREE.Box3(), box = new THREE.Box3(), meshes = [];
        mesh.traverse(function (o) {
          if (!o.isMesh || !o.geometry) return;
          if (!o.geometry.boundingBox) o.geometry.computeBoundingBox();
          tmp.copy(o.geometry.boundingBox);
          m.multiplyMatrices(inv, o.matrixWorld); tmp.applyMatrix4(m); box.union(tmp);
          if (o.geometry.attributes.position) meshes.push(o);
        });
        if (box.isEmpty()) return;
        var size = new THREE.Vector3(), center = new THREE.Vector3();
        box.getSize(size); box.getCenter(center);
        var maxDim = Math.max(size.x, size.y, size.z); if (!maxDim) return;
        var k = this.data.size / maxDim;
        obj.scale.setScalar(k); obj.position.copy(center).multiplyScalar(-k);
        var v = new THREE.Vector3(), maxY = -Infinity;
        meshes.forEach(function (o) {
          m.multiplyMatrices(inv, o.matrixWorld);
          var pos = o.geometry.attributes.position;
          for (var i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m); if (v.y > maxY) maxY = v.y; }
        });
        var tol = size.y * 0.03, sx = 0, sz = 0, n = 0;
        meshes.forEach(function (o) {
          m.multiplyMatrices(inv, o.matrixWorld);
          var pos = o.geometry.attributes.position;
          for (var i = 0; i < pos.count; i++) { v.fromBufferAttribute(pos, i).applyMatrix4(m); if (v.y >= maxY - tol) { sx += v.x; sz += v.z; n++; } }
        });
        var top = n ? { x: (sx/n - center.x)*k, y: (maxY - center.y)*k, z: (sz/n - center.z)*k }
                    : { x: 0, y: size.y*k/2, z: 0 };
        el.emit('model-fitted', { halfHeight: size.y * k / 2, top: top });
      }
    });

    AFRAME.registerComponent('frame-tick', {
      tick: function (t, dt) { if (window.onFrame) window.onFrame(dt); }
    });
  </script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <h1>📦 AR 3D Viewer</h1>
    <p>Nhấn nút bên dưới để bắt đầu. Hướng camera vào marker Chánh Điện để xem mô hình 3D.</p>
    <button id="start-btn">📷 Bắt đầu AR</button>
    <div class="platform-badge" id="platform-info"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hint">📌 Hướng camera vào marker Chánh Điện</div>
    <div class="status status-searching" id="marker-status">🔍 Đang tìm marker...</div>
  </div>

  <!-- Nút điều khiển -->
  <button id="reset-btn">↺ Reset</button>
  <button id="info-btn">ℹ️</button>

  <!-- Info panel -->
  <div id="info-overlay"></div>
  <div id="info-panel">
    <div class="panel-handle"></div>
    <button class="close-panel" id="close-panel-btn">✕</button>
    <h2 id="panel-title"></h2>
    <hr class="divider">
    <p id="panel-body"></p>
  </div>

  <!-- AR Scene -->
  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix; matrixCodeType: 3x3;
            patternRatio: 0.75;">

    <a-assets timeout="15000">
      <a-asset-item id="myModel" src="models/chanh_dien.glb"></a-asset-item>
    </a-assets>

    <a-light type="ambient"     color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <a-marker type="pattern" url="marker/pattern_chanh_dien.patt"
              emitevents="true"
              smooth="true" smoothCount="10"
              smoothTolerance="0.01" smoothThreshold="5"
              id="hiro-marker">

      <a-entity id="base" rotation="0 0 0" frame-tick>
        <a-entity id="pivot">
          <a-entity id="model" gltf-model="#myModel" auto-fit="size: 1"></a-entity>
        </a-entity>
        <a-entity id="card"></a-entity>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Logic -->
  <script src="js/main.js"></script>
</body>
</html>
