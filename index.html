<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>AR 3D Viewer</title>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #000;
    }

    /* ===== Splash / Start Screen ===== */
    #splash {
      position: fixed; inset: 0;
      z-index: 10000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff;
      padding: 20px;
      text-align: center;
    }
    #splash h1 { font-size: 28px; margin-bottom: 8px; }
    #splash p { font-size: 15px; color: #aaa; margin-bottom: 30px; max-width: 320px; }

    #start-btn {
      padding: 18px 50px;
      font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff;
      border: none; border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(0, 180, 216, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    #start-btn:active {
      transform: scale(0.95);
      box-shadow: 0 3px 15px rgba(0, 180, 216, 0.3);
    }

    .platform-badge {
      margin-top: 20px;
      font-size: 12px;
      color: #666;
      padding: 6px 14px;
      border: 1px solid #333;
      border-radius: 20px;
    }

    /* ===== Loading ===== */
    #loading {
      position: fixed; inset: 0;
      z-index: 9999;
      background: rgba(0,0,0,0.85);
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff;
    }
    .spinner {
      width: 50px; height: 50px;
      border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #00b4d8;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 16px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== HUD Overlay ===== */
    #hud {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      z-index: 9997;
      padding: 16px 20px 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      text-align: center;
      display: none;
    }
    #hud .hint {
      color: #fff;
      font-size: 14px;
      text-shadow: 0 1px 4px rgba(0,0,0,0.8);
    }
    #hud .status {
      display: inline-block;
      margin-top: 8px;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-searching {
      background: rgba(255, 193, 7, 0.3);
      color: #ffc107;
      border: 1px solid rgba(255, 193, 7, 0.5);
    }
    .status-found {
      background: rgba(76, 175, 80, 0.3);
      color: #4caf50;
      border: 1px solid rgba(76, 175, 80, 0.5);
    }

    /* ===== Error Screen ===== */
    #error-screen {
      position: fixed; inset: 0;
      z-index: 10001;
      background: #1a1a2e;
      display: none;
      flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; padding: 20px;
      text-align: center;
    }
    #error-screen h2 { color: #ef5350; margin-bottom: 12px; }
    #error-screen p { color: #aaa; max-width: 320px; font-size: 14px; line-height: 1.6; }
    #error-screen button {
      margin-top: 20px; padding: 12px 30px;
      background: #ef5350; color: #fff;
      border: none; border-radius: 8px;
      font-size: 16px; cursor: pointer;
    }
  </style>
</head>

<body>

  <!-- ===== Splash Screen ===== -->
  <div id="splash">
    <h1>📦 AR 3D Viewer</h1>
    <p>Nhấn nút bên dưới để mở camera, sau đó hướng vào marker Hiro để xem mô hình 3D</p>
    <button id="start-btn" onclick="startAR()">📷 Bắt đầu AR</button>
    <div class="platform-badge" id="platform-info"></div>
  </div>

  <!-- ===== Loading ===== -->
  <div id="loading">
    <div class="spinner"></div>
    <div>Đang khởi tạo camera...</div>
  </div>

  <!-- ===== Error Screen ===== -->
  <div id="error-screen">
    <h2>⚠️ Không thể mở camera</h2>
    <p id="error-msg">Vui lòng kiểm tra quyền truy cập camera và đảm bảo truy cập qua HTTPS.</p>
    <button onclick="location.reload()">Thử lại</button>
  </div>

  <!-- ===== HUD ===== -->
  <div id="hud">
    <div class="hint">📌 Hướng camera vào marker Hiro</div>
    <div class="status status-searching" id="marker-status">🔍 Đang tìm marker...</div>
  </div>

  <!-- ===== AR Scene ===== -->
  <div id="ar-container" style="display:none;">
    <a-scene
        embedded
        vr-mode-ui="enabled: false"
        loading-screen="enabled: false"
        renderer="logarithmicDepthBuffer: true; colorManagement: true; antialias: true; precision: mediump;"
        arjs="sourceType: webcam;
              debugUIEnabled: false;
              detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

      <a-assets timeout="15000">
        <a-asset-item id="myModel" src="models/model.glb"></a-asset-item>
      </a-assets>

      <!-- Ánh sáng tối ưu cho mobile -->
      <a-light type="ambient" color="#ffffff" intensity="0.7"></a-light>
      <a-light type="directional" color="#ffffff" intensity="0.5"
               position="1 3 2"></a-light>
      <a-light type="directional" color="#ffeedd" intensity="0.3"
               position="-1 1 -1"></a-light>

      <!-- Marker với smoothing cho ổn định -->
      <a-marker preset="hiro"
                emitevents="true"
                smooth="true" smoothCount="10"
                smoothTolerance="0.01" smoothThreshold="5"
                id="hiro-marker">
        <a-entity
          gltf-model="#myModel"
          position="0 0 0"
          rotation="0 0 0"
          scale="0.5 0.5 0.5"
          animation-mixer
          id="model-entity">
        </a-entity>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </div>

  <script>
    // ===== Platform Detection =====
    (function detectPlatform() {
      var ua = navigator.userAgent;
      var info = '';
      if (/iPhone|iPad|iPod/.test(ua)) {
        info = '🍎 iOS — Sử dụng Safari để có trải nghiệm tốt nhất';
      } else if (/Android/.test(ua)) {
        info = '🤖 Android — Sử dụng Chrome để có trải nghiệm tốt nhất';
      } else {
        info = '💻 Desktop — Cần webcam';
      }
      document.getElementById('platform-info').textContent = info;
    })();

    // ===== HTTPS Check =====
    if (location.protocol !== 'https:' && location.hostname !== 'localhost' && location.hostname !== '127.0.0.1') {
      console.warn('⚠️ Trang cần HTTPS để truy cập camera trên mobile');
    }

    // ===== Start AR =====
    function startAR() {
      var splash = document.getElementById('splash');
      var loading = document.getElementById('loading');
      var arContainer = document.getElementById('ar-container');
      var hud = document.getElementById('hud');
      var errorScreen = document.getElementById('error-screen');

      splash.style.display = 'none';
      loading.style.display = 'flex';

      // Kiểm tra camera trước
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        loading.style.display = 'none';
        document.getElementById('error-msg').textContent =
          'Trình duyệt không hỗ trợ truy cập camera. Hãy mở bằng Safari (iOS) hoặc Chrome (Android).';
        errorScreen.style.display = 'flex';
        return;
      }

      // Yêu cầu quyền camera (user gesture)
      navigator.mediaDevices.getUserMedia({
        video: {
          facingMode: 'environment',  // Camera sau
          width: { ideal: 1280 },
          height: { ideal: 720 }
        }
      })
      .then(function(stream) {
        // Camera OK → dừng stream test, để AR.js tự quản lý
        stream.getTracks().forEach(function(track) { track.stop(); });

        // Hiển thị AR scene
        arContainer.style.display = 'block';

        var scene = document.querySelector('a-scene');
        scene.addEventListener('loaded', function() {
          loading.style.display = 'none';
          hud.style.display = 'block';
          setupMarkerEvents();
        });

        // Fallback timeout
        setTimeout(function() {
          loading.style.display = 'none';
          hud.style.display = 'block';
          setupMarkerEvents();
        }, 6000);
      })
      .catch(function(err) {
        loading.style.display = 'none';
        var msg = 'Không thể truy cập camera. ';
        if (err.name === 'NotAllowedError') {
          msg += 'Bạn đã từ chối quyền camera. Hãy vào Cài đặt để cấp lại quyền.';
        } else if (err.name === 'NotFoundError') {
          msg += 'Không tìm thấy camera trên thiết bị.';
        } else if (err.name === 'NotReadableError') {
          msg += 'Camera đang được ứng dụng khác sử dụng.';
        } else {
          msg += 'Lỗi: ' + err.message;
        }
        document.getElementById('error-msg').textContent = msg;
        errorScreen.style.display = 'flex';
      });
    }

    // ===== Marker Events =====
    var markerEventsSetup = false;
    function setupMarkerEvents() {
      if (markerEventsSetup) return;
      markerEventsSetup = true;

      var marker = document.getElementById('hiro-marker');
      var statusEl = document.getElementById('marker-status');
      if (!marker || !statusEl) return;

      marker.addEventListener('markerFound', function() {
        statusEl.textContent = '✅ Marker đã nhận diện!';
        statusEl.className = 'status status-found';
      });

      marker.addEventListener('markerLost', function() {
        statusEl.textContent = '🔍 Đang tìm marker...';
        statusEl.className = 'status status-searching';
      });
    }
  </script>
</body>
</html>
