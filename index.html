<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AR 3D Viewer</title>

  <!-- Load thư viện trước -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <script>
    // Component tự động căn giữa và đặt chân mô hình lên đúng mặt phẳng marker
    AFRAME.registerComponent('auto-center', {
      init: function () {
        this.el.addEventListener('model-loaded', () => {
          const obj = this.el.getObject3D('mesh');
          if (!obj) return;

          // Tính bounding box của mô hình
          const box = new THREE.Box3().setFromObject(obj);
          const center = new THREE.Vector3();
          box.getCenter(center);

          // Điểm đáy ở giữa mô hình
          const bottom = new THREE.Vector3(center.x, box.min.y, center.z);

          // Chuyển sang tọa độ local của entity
          this.el.object3D.worldToLocal(bottom);

          // Căn chỉnh để tâm X, Z ở giữa marker và chân Y chạm mặt marker
          obj.position.x -= bottom.x;
          obj.position.y -= bottom.y;
          obj.position.z -= bottom.z;
        });
      }
    });
  </script>

  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }

    #splash {
      position: fixed; inset: 0; z-index: 10000;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      color: #fff; padding: 20px; text-align: center;
    }
    #splash h1 { font-size: 28px; margin-bottom: 8px; }
    #splash p { font-size: 15px; color: #aaa; margin-bottom: 30px; max-width: 320px; }
    #start-btn {
      padding: 18px 50px; font-size: 18px; font-weight: 600;
      background: linear-gradient(135deg, #00b4d8, #0077b6);
      color: #fff; border: none; border-radius: 50px; cursor: pointer;
      box-shadow: 0 6px 25px rgba(0,180,216,0.4);
    }
    #start-btn:active { transform: scale(0.95); }
    .platform-badge {
      margin-top: 20px; font-size: 12px; color: #666;
      padding: 6px 14px; border: 1px solid #333; border-radius: 20px;
    }

    #hud {
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 9997;
      padding: 16px 20px 30px;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
      text-align: center; display: none;
    }
    #hud .hint { color: #fff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .status {
      display: inline-block; margin-top: 8px; padding: 4px 12px;
      border-radius: 20px; font-size: 12px; font-weight: 600;
    }
    .status-searching { background: rgba(255,193,7,0.3); color: #ffc107; border: 1px solid rgba(255,193,7,0.5); }
    .status-found { background: rgba(76,175,80,0.3); color: #4caf50; border: 1px solid rgba(76,175,80,0.5); }
  </style>
</head>
<body>

  <!-- Splash overlay - phủ lên AR scene bên dưới -->
  <div id="splash">
    <h1>📦 AR 3D Viewer</h1>
    <p>Nhấn nút bên dưới để bắt đầu. Hướng camera vào marker Hiro để xem mô hình 3D.</p>
    <button id="start-btn">📷 Bắt đầu AR</button>
    <div class="platform-badge" id="platform-info"></div>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hint">📌 Hướng camera vào marker Hiro</div>
    <div class="status status-searching" id="marker-status">🔍 Đang tìm marker...</div>
  </div>

  <!-- AR Scene - luôn có trong DOM, splash chỉ phủ lên trên -->
  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      loading-screen="enabled: false"
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix; matrixCodeType: 3x3;">

    <a-assets timeout="15000">
      <a-asset-item id="myModel" src="models/rong_viensau_2.glb"></a-asset-item>
    </a-assets>

    <a-light type="ambient" color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <a-marker preset="hiro" emitevents="true"
              smooth="true" smoothCount="10"
              smoothTolerance="0.01" smoothThreshold="5"
              id="hiro-marker">
      <a-entity
        id="dragon-entity"
        gltf-model="#myModel"
        position="0 0 0"
        rotation="0 0 0"
        scale="0.5 0.5 0.5"
        auto-center>
      </a-entity>
    </a-marker>

    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Platform detection
    var ua = navigator.userAgent;
    var info = /iPhone|iPad|iPod/.test(ua) ? '🍎 iOS — Dùng Safari'
             : /Android/.test(ua) ? '🤖 Android — Dùng Chrome'
             : '💻 Desktop — Cần webcam';
    document.getElementById('platform-info').textContent = info;

    // Start button - chỉ ẩn splash, AR scene đã chạy bên dưới
    document.getElementById('start-btn').addEventListener('click', function() {
      document.getElementById('splash').style.display = 'none';
      document.getElementById('hud').style.display = 'block';

      // Marker events
      var marker = document.getElementById('hiro-marker');
      var statusEl = document.getElementById('marker-status');
      if (marker) {
        marker.addEventListener('markerFound', function() {
          statusEl.textContent = '✅ Marker đã nhận diện!';
          statusEl.className = 'status status-found';
        });
        marker.addEventListener('markerLost', function() {
          statusEl.textContent = '🔍 Đang tìm marker...';
          statusEl.className = 'status status-searching';
        });
      }
    });
  </script>
</body>
</html>
