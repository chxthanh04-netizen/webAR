<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Trải nghiệm di sản qua AR</title>

  <!-- Thư viện AR -->
  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
  <script src="https://cdn.jsdelivr.net/gh/AR-js-org/AR.js@3.4.5/aframe/build/aframe-ar.js"></script>

  <!-- A-Frame components dùng chung -->
  <script src="js/ar-components.js"></script>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Splash -->
  <div id="splash">
    <h1>TRẢI NGHIỆM<br>DI SẢN QUA AR</h1>
    <p>Hướng camera vào marker trong sổ tay để khám phá các mô hình 3D.</p>
    <button id="start-btn">Bắt đầu AR</button>
  </div>

  <!-- HUD -->
  <div id="hud">
    <div class="hint">📌 Hướng camera vào marker trong sổ tay</div>
    <div class="status status-searching" id="marker-status">🔍 Đang tìm marker...</div>
  </div>

  <!-- Nút điều khiển -->
  <button id="reset-btn">↺ Reset</button>
  <button id="back-btn"></button>
  <div id="history-topics" role="group" aria-label="Lịch sử Phật hoàng Trần Nhân Tông" hidden>
    <button type="button" data-topic="thienPhai"
            aria-label="Thiền phái Trúc Lâm" title="Thiền phái Trúc Lâm">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path d="M12 20c-3.8 0-8.5-2.1-9.5-8 4-.3 7.1 1.4 9.5 8Zm0 0c3.8 0 8.5-2.1 9.5-8-4-.3-7.1 1.4-9.5 8Z"/>
        <path d="M8 13.5c.2-3.4 1.6-6.2 4-8.5 2.4 2.3 3.8 5.1 4 8.5"/>
      </svg>
    </button>
    <button type="button" data-topic="vuaTran"
            aria-label="Vua Trần Nhân Tông" title="Vua Trần Nhân Tông">
      <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <circle cx="12" cy="7.5" r="3.5"/>
        <path d="M5 20.5v-1.75a7 5.25 0 0 1 14 0v1.75Z"/>
      </svg>
    </button>
  </div>

  <!-- Chế độ lấy toạ độ chấm sáng: mở trang với ?calib=1 -->
  <div id="calib-box"></div>
  <button id="calib-next">Lớp tiếp ›</button>

  <!-- AR Scene -->
  <a-scene
      embedded
      vr-mode-ui="enabled: false"
      device-orientation-permission-ui="enabled: false"
      loading-screen="enabled: false"
      wait-for-patterns
      renderer="logarithmicDepthBuffer: true; colorManagement: true;"
      arjs="sourceType: webcam;
            debugUIEnabled: false;
            detectionMode: mono_and_matrix; matrixCodeType: 3x3;
            patternRatio: 0.75;">

    <a-light type="ambient"     color="#ffffff" intensity="0.9"></a-light>
    <a-light type="directional" color="#ffffff" intensity="0.8" position="1 3 2"></a-light>

    <!-- Marker 1: Chánh Điện (1 lớp) -->
    <a-marker type="pattern" url="marker/pattern_chanh_dien.patt"
              min-confidence="0.9"
              smooth="true" smooth-count="10"
              smooth-tolerance="0.01" smooth-threshold="5"
              id="marker-chanh-dien">
      <a-entity id="chanh-dien-base">
        <a-entity id="chanh-dien-pivot">
          <a-entity id="chanh-dien-model" auto-fit="size: 1"></a-entity>
        </a-entity>
        <a-entity id="chanh-dien-card"></a-entity>
      </a-entity>
    </a-marker>

    <!-- Marker 2: Lầu Trống → Mái Đao → Ngói (3 lớp, model được nạp bằng main.js) -->
    <a-marker type="pattern" url="marker/pattern_lau.patt"
              min-confidence="0.9"
              smooth="true" smooth-count="10"
              smooth-tolerance="0.01" smooth-threshold="5"
              id="marker-lau-trong">
      <a-entity id="lau-trong-base">
        <a-entity id="lau-trong-pivot">
          <a-entity id="lau-trong-model" auto-fit="size: 1"></a-entity>
        </a-entity>
        <a-entity id="lau-trong-card"></a-entity>
      </a-entity>
    </a-marker>

    <!-- Marker 3: Tượng Phật hoàng Trần Nhân Tông -->
    <a-marker type="pattern" url="marker/pattern_tuong.patt"
              smooth="true" smooth-count="10"
              smooth-tolerance="0.01" smooth-threshold="5"
              id="marker-tuong-phat-hoang">
      <a-entity id="tuong-phat-hoang-base">
        <a-entity id="tuong-phat-hoang-pivot">
          <a-entity id="tuong-phat-hoang-model" auto-fit="size: 1"></a-entity>
        </a-entity>
        <a-entity id="tuong-phat-hoang-card"></a-entity>
      </a-entity>
    </a-marker>

    <!-- Gọi window.onFrame mỗi khung hình (chỉ 1 chỗ, ngoài marker) -->
    <a-entity frame-tick></a-entity>

    <a-entity camera></a-entity>
  </a-scene>

  <!-- Logic -->
  <script src="js/main.js"></script>
</body>
</html>
